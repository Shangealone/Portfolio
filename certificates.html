<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Certificates | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f0f0f;
    --paper: #f5f0e8;
    --cream: #ede8db;
    --accent: #c84b31;
    --accent2: #2d6a4f;
    --muted: #7a7265;
    --card: #ffffff;
    --border: rgba(15,15,15,0.12);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow-x: hidden;
  }

  /* NOISE TEXTURE OVERLAY */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.5;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.2rem 5vw;
    background: rgba(245,240,232,0.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 1.3rem;
    letter-spacing: -0.03em;
    color: var(--ink);
    text-decoration: none;
  }

  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--accent); }

  /* SECTION HEADER */
  section { padding: 8rem 5vw 6rem; min-height: 100vh; }
  
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 1.5rem;
    margin-bottom: 3.5rem;
  }

  .section-number {
    font-family: 'Playfair Display', serif;
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--accent);
    letter-spacing: 0.1em;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* CERTIFICATES GRID */
  .cert-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 2rem;
  }

  .cert-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    transition: all 0.3s;
    text-decoration: none;
    color: var(--ink);
  }

  .cert-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(15,15,15,0.1);
    border-color: var(--accent);
  }

  .cert-image-wrap {
    width: 100%;
    aspect-ratio: 4/3;
    background: var(--paper);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
  }

  .cert-image-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s;
  }

  .cert-card:hover .cert-image-wrap img {
    transform: scale(1.05);
  }

  /* Styling for PDF placeholders */
  .pdf-placeholder {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--muted);
    font-weight: 700;
  }

  .cert-info {
    padding: 0.5rem 0;
  }

  .cert-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 0.3rem;
  }

  .cert-tag {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }

  /* FOOTER */
  footer {
    background: var(--ink);
    color: var(--paper);
    padding: 3rem 5vw;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1.5rem;
  }

  .footer-brand {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 900;
  }

  .footer-note {
    font-size: 0.8rem;
    color: rgba(245,240,232,0.45);
  }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Portfolio</a>
  <ul class="nav-links">
    <li><a href="index.html#about">Back to Home</a></li>
    <li><a href="index.html#projects">Projects</a></li>
    <li><a href="index.html#skills">Skills</a></li>
  </ul>
</nav>

<section>
  <div class="section-header">
    <span class="section-number">05 —</span>
    <h2 class="section-title">Certifications</h2>
    <div class="section-line"></div>
  </div>

  <div class="cert-grid">
    
    <a href="pic/Gealone_Certificate - IoT.png" target="_blank" class="cert-card">
      <div class="cert-image-wrap">
        <img src="pic/Gealone_Certificate - IoT.png" alt="IoT Certificate">
      </div>
      <div class="cert-info">
        <div class="cert-tag">Internet of Things</div>
        <h3 class="cert-title">IoT Certification</h3>
      </div>
    </a>

    <a href="pic/Gealone_Certificate.png" target="_blank" class="cert-card">
      <div class="cert-image-wrap">
        <img src="pic/Gealone_Certificate.png" alt="General Certificate">
      </div>
      <div class="cert-info">
        <div class="cert-tag">Achievement</div>
        <h3 class="cert-title">Completion Certificate</h3>
      </div>
    </a>

    <a href="pic/Python_Essentials_1.pdf" target="_blank" class="cert-card">
      <div class="cert-image-wrap">
        <span class="pdf-placeholder">View PDF Document</span>
      </div>
      <div class="cert-info">
        <div class="cert-tag">Programming</div>
        <h3 class="cert-title">Python Essentials 1</h3>
      </div>
    </a>

    <a href="pic/Python_Essentials_2.pdf" target="_blank" class="cert-card">
      <div class="cert-image-wrap">
        <span class="pdf-placeholder">View PDF Document</span>
      </div>
      <div class="cert-info">
        <div class="cert-tag">Programming</div>
        <h3 class="cert-title">Python Essentials 2</h3>
      </div>
    </a>

  </div>
</section>

<footer>
  <div class="footer-brand">Portfolio</div>
  <div class="footer-note">Built for OJT Application · 2026</div>
</footer>

</body>
</html>
